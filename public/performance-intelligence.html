<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Performance Intelligence</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .dashboard { max-width: 1200px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; }
        .metric-title { color: #94a3b8; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
        .metric-value { font-size: 2.5rem; font-weight: 700; color: #38bdf8; margin-bottom: 1rem; }
        .explanation { font-size: 0.875rem; color: #cbd5e1; line-height: 1.5; background: #0f172a; padding: 1rem; border-radius: 8px; border-left: 4px solid #38bdf8; }
        h1 { text-align: center; color: #f8fafc; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <h1>Performance Intelligence Dashboard</h1>
    <div class="dashboard" id="ai-dashboard">
        <!-- Rendered via JS -->
    </div>
    <script src="/js/performance-intelligence.js"></script>
</body>
</html>
