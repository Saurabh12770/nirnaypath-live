<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/lifecycle.js"></script>
    <script src="/js/uiState.js"></script>
    <script src="/js/renderController.js"></script>

    <script src="/js/authStore.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Test Leaderboard - NirnayPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onerror="this.onerror=null;this.href='/vendor/fontawesome/css/all.min.css';">
    <link rel="stylesheet" href="/style.css?v=3.0.0">
    <style>
        .leaderboard-container { max-width: 900px; margin: 80px auto; padding: 40px; }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 30px; background: var(--bg-card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); }
        .leaderboard-table th, .leaderboard-table td { padding: 18px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .leaderboard-table th { background: var(--primary-gradient); color: white; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; }
        .rank-1 { color: #FFD700; font-weight: 800; }
        .rank-2 { color: #C0C0C0; font-weight: 800; }
        .rank-3 { color: #CD7F32; font-weight: 800; }
        .aspirant-name { font-weight: 600; color: var(--text-primary); }
        .score-val { font-weight: 700; color: var(--primary); }
    </style>
</head>
<body class="light-mode">
<div class="app-shell">
    <div class="app-content">
    <header class="sticky-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="logo-text">
                <span class="logo-main">NirnayPath</span>
                <span class="logo-sub">Mock Test Platform</span>
            </div>
        </div>
        <nav id="desktopNav">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About Us</a>
            <a href="/admin" id="adminNavLink" class="nav-link"><i class="fas fa-user-shield"></i> Admin</a>
            <button id="loginBtn" class="nav-link">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </nav>
        <div class="header-right">
            <button id="themeToggle" aria-label="Dark mode" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <button id="mobileMenuToggle" class="mobile-menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div id="mobileNavPanel" class="mobile-nav-panel">
        <div class="panel-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-compass"></i></div>
                <div class="logo-text"><span class="logo-main">NirnayPath</span></div>
            </div>
            <button id="closePanelBtn" class="close-panel-btn">&times;</button>
        </div>
        <nav class="panel-nav">
            <a href="index.html" class="panel-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="panel-link"><i class="fas fa-info-circle"></i> About Us</a>
            <a href="/admin" id="mobileAdminNavLink" class="panel-link"><i class="fas fa-user-shield"></i> Admin Panel</a>
            <button id="mobileLoginBtn" class="panel-link login-btn-mobile"><i class="fas fa-sign-in-alt"></i> Login / Register</button>
        </nav>
        <div class="panel-footer">
            <p>India's Most Trusted Free Mock Test Platform</p>
        </div>
    </div>
    <div id="panelOverlay" class="panel-overlay"></div>

    <main>
        <div class="leaderboard-container reveal active">
            <div style="text-align: center; margin-bottom: 40px;">
                <h1 class="section-title">🏆 Live Test <span class="gradient-text">Leaderboard</span></h1>
                <p style="color: var(--text-secondary);">Real-time rankings for the ongoing test session</p>
            </div>

            <div id="loading" class="text-center" style="padding: 40px; color: var(--text-secondary);">
                <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>
                Loading rankings...
            </div>
            
            <table class="leaderboard-table" id="leaderboardTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Aspirant</th>
                        <th>Score</th>
                        <th>Total</th>
                        <th>Submitted At</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </main>

    <script src="script.js?v=3.0.0"></script>
    <script>
        async function fetchLeaderboard() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId');
            
            if (!sessionId) {
                document.getElementById('loading').textContent = 'Error: No session ID provided.';
                return;
            }

            try {
                const response = await fetch(`/api/live/leaderboard/${sessionId}`);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                const table = document.getElementById('leaderboardTable');
                const tbody = document.getElementById('leaderboardBody');

                if (!data.length) {
                    document.getElementById('loading').innerHTML = '<i class="fas fa-info-circle"></i><br><br>No results found for this session yet.';
                    document.getElementById('loading').style.display = 'block';
                    return;
                }

                table.style.display = 'table';
                tbody.innerHTML = data.map((res, index) => {
                    const rank = index + 1;
                    const rankClass = rank <= 3 ? `rank-${rank}` : '';
                    const submitted = new Date(res.submittedAt).toLocaleTimeString();
                    
                    return `
                        <tr>
                            <td class="${rankClass}">#${rank} ${rank <= 3 ? '<i class="fas fa-medal"></i>' : ''}</td>
                            <td class="aspirant-name">${res.userId?.name || 'Aspirant'}</td>
                            <td class="score-val">${res.score}</td>
                            <td>${res.totalQuestions}</td>
                            <td style="color: var(--text-secondary); font-size: 0.9rem;">${submitted}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('Leaderboard error:', error);
                document.getElementById('loading').textContent = 'Failed to load leaderboard.';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
    </div>
</div>
</body>
</html>
