<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/lifecycle.js"></script>
    <script src="/js/uiState.js"></script>
    <script src="/js/renderController.js"></script>

    <script src="/js/authStore.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Reset Password - NirnayPath</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" onerror="this.onerror=null;this.href='/vendor/fontawesome/css/all.min.css';">
    <link rel="stylesheet" href="/style.css?v=3.0.0">
    <style>
        .reset-container {
            max-width: 450px;
            margin: 120px auto 60px;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: var(--text-primary); }
        .form-group input { 
            width: 100%; 
            padding: 14px; 
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 12px; 
            box-sizing: border-box;
            color: var(--text-primary);
            font-family: inherit;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .reset-btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary-gradient);
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 700; 
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .reset-btn:hover { transform: translateY(-2px); }
        .reset-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .message { margin-top: 24px; padding: 14px; border-radius: 12px; display: none; font-weight: 500; text-align: center; }
        .success { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="light-mode">
<div class="app-shell">
    <div class="app-content">
    <header class="sticky-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="logo-text">
                <span class="logo-main">NirnayPath</span>
                <span class="logo-sub">Mock Test Platform</span>
            </div>
        </div>
        <nav id="desktopNav">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About Us</a>
            <a href="/admin" id="adminNavLink" class="nav-link"><i class="fas fa-user-shield"></i> Admin</a>
            <button id="loginBtn" class="nav-link">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </nav>
        <div class="header-right">
            <button id="themeToggle" aria-label="Dark mode" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <button id="mobileMenuToggle" class="mobile-menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div id="mobileNavPanel" class="mobile-nav-panel">
        <div class="panel-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-compass"></i></div>
                <div class="logo-text"><span class="logo-main">NirnayPath</span></div>
            </div>
            <button id="closePanelBtn" class="close-panel-btn">&times;</button>
        </div>
        <nav class="panel-nav">
            <a href="index.html" class="panel-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="panel-link"><i class="fas fa-info-circle"></i> About Us</a>
            <a href="/admin" id="mobileAdminNavLink" class="panel-link"><i class="fas fa-user-shield"></i> Admin Panel</a>
            <button id="mobileLoginBtn" class="panel-link login-btn-mobile"><i class="fas fa-sign-in-alt"></i> Login / Register</button>
        </nav>
        <div class="panel-footer">
            <p>India's Most Trusted Free Mock Test Platform</p>
        </div>
    </div>
    <div id="panelOverlay" class="panel-overlay"></div>

    <main>
        <div class="reset-container reveal active">
            <h2 style="text-align: center; margin-bottom: 12px; font-size: 1.75rem;">Reset Your Password</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 35px;">Enter your new password below to regain access to your account.</p>
            
            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat new password" required minlength="6">
                </div>
                <button type="submit" class="reset-btn" id="resetBtn">Reset Password</button>
            </form>
            
            <div id="msgArea" class="message"></div>
        </div>
    </main>

    <script src="script.js?v=3.0.0"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgArea = document.getElementById('msgArea');
            const resetBtn = document.getElementById('resetBtn');

            if (newPassword !== confirmPassword) {
                msgArea.textContent = 'Passwords do not match.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgArea.textContent = 'Invalid reset token in URL.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    msgArea.textContent = data.message;
                    msgArea.className = 'message success';
                    msgArea.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html?reset=success';
                    }, 2000);
                } else {
                    msgArea.textContent = data.error || 'Reset failed. Link may have expired.';
                    msgArea.className = 'message error';
                    msgArea.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (err) {
                msgArea.textContent = 'An error occurred. Please try again.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
    </div>
</div>
</body>
</html>
