<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NirnayPath</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .reset-btn { 
            width: 100%; 
            padding: 14px; 
            background: #4F46E5; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: 700; 
            cursor: pointer;
        }
        .message { margin-top: 20px; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="light-mode">
    <!-- Standard Header -->
    <header class="sticky-header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="logo-text">
                <span class="logo-main">NirnayPath</span>
                <span class="logo-sub">Mock Test Platform</span>
            </div>
        </div>
        <nav id="desktopNav">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fas fa-info-circle"></i> About Us</a>
        </nav>
        <div class="header-right">
            <button id="themeToggle" aria-label="Dark mode" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <!-- New Side Navigation Panel -->
    <div id="mobileNavPanel" class="mobile-nav-panel">
        <div class="panel-header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-compass"></i></div>
                <div class="logo-text"><span class="logo-main">NirnayPath</span></div>
            </div>
            <button id="closePanelBtn" class="close-panel-btn">&times;</button>
        </div>
        <nav class="panel-nav">
            <a href="index.html" class="panel-link"><i class="fas fa-home"></i> Home</a>
            <a href="about.html" class="panel-link"><i class="fas fa-info-circle"></i> About Us</a>
        </nav>
    </div>
    <div id="panelOverlay" class="panel-overlay"></div>
    <div class="reset-container">
        <h2 style="text-align: center; margin-bottom: 20px;">Reset Your Password</h2>
        <p style="text-align: center; color: #64748b; margin-bottom: 30px;">Enter your new password below to regain access to your account.</p>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat new password" required minlength="6">
            </div>
            <button type="submit" class="reset-btn" id="resetBtn">Reset Password</button>
        </form>
        
        <div id="msgArea" class="message"></div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgArea = document.getElementById('msgArea');
            const resetBtn = document.getElementById('resetBtn');

            if (newPassword !== confirmPassword) {
                msgArea.textContent = 'Passwords do not match.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                msgArea.textContent = 'Invalid reset token in URL.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    msgArea.textContent = data.message;
                    msgArea.className = 'message success';
                    msgArea.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html?reset=success';
                    }, 2000);
                } else {
                    msgArea.textContent = data.error || 'Reset failed. Link may have expired.';
                    msgArea.className = 'message error';
                    msgArea.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (err) {
                msgArea.textContent = 'An error occurred. Please try again.';
                msgArea.className = 'message error';
                msgArea.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
