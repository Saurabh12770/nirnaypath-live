<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NirnayPath Ops</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 10px; }
        .header { background: #1E293B; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-card { background: #0F172A; padding: 15px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .metric-value { font-size: 24px; font-weight: bold; color: #10B981; }
        .metric-value.danger { color: #EF4444; }
        .action-btn { width: 100%; background: #EF4444; color: white; padding: 15px; border: none; border-radius: 8px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">NirnayPath Ops - Live</div>
    
    <div class="metric-grid">
        <div class="metric-card">
            <div class="metric-value">124K</div>
            <div style="font-size: 12px; color: #888;">Live Candidates</div>
        </div>
        <div class="metric-card">
            <div class="metric-value danger">87%</div>
            <div style="font-size: 12px; color: #888;">Redis Mem</div>
        </div>
        <div class="metric-card">
            <div class="metric-value">45ms</div>
            <div style="font-size: 12px; color: #888;">API Latency</div>
        </div>
        <div class="metric-card">
            <div class="metric-value">0</div>
            <div style="font-size: 12px; color: #888;">P0 Incidents</div>
        </div>
    </div>

    <button class="action-btn">ESCALATE TO WAR ROOM</button>
</body>
</html>
