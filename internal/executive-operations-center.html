<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National Operations Control Plane</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; }
        .card { background: #1e293b; padding: 15px; border-radius: 8px; border-top: 3px solid #3b82f6; }
        .card.alert { border-top-color: #ef4444; }
        .card h3 { font-size: 12px; text-transform: uppercase; margin: 0 0 10px 0; color: #94a3b8; }
        .val { font-size: 24px; font-weight: bold; }
        .feed { grid-column: span 2; max-height: 300px; overflow-y: auto; background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px;}
        .feed-item { border-bottom: 1px solid #334155; padding: 5px 0; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
        .status-dot.red { background: #ef4444; }
        .top-bar { padding: 15px 20px; background: #0b1120; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body>
    <div class="top-bar">
        <h2>Executive Go-Live Control Plane</h2>
        <div><span class="status-dot"></span> Cluster Sync Active</div>
    </div>
    <div class="grid" id="dashboard-grid">
        <!-- Rendered by JS -->
    </div>
    <script src="js/executive-operations-center.js"></script>
</body>
</html>
