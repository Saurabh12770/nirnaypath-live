<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NirnayPath | National Enterprise Business Intelligence</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #94a3b8; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 2.5em; font-weight: bold; color: #38bdf8; }
        .chart-placeholder { height: 200px; background: #334155; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #94a3b8; margin-top: 20px;}
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>National BI Command Center</h1>
            <div>Live Operational Telemetry</div>
        </div>
        <div class="grid">
            <div class="card">
                <h3>Total Marketplace Revenue</h3>
                <div class="value">₹12.4M</div>
            </div>
            <div class="card">
                <h3>Active Institutional Tenants</h3>
                <div class="value">428</div>
            </div>
            <div class="card">
                <h3>AI Content Moderations (24h)</h3>
                <div class="value">1,205</div>
            </div>
            <div class="card">
                <h3>Platform Commission (MTD)</h3>
                <div class="value">₹1.86M</div>
            </div>
        </div>
        <div class="chart-placeholder">
            [Regional Adoption Heatmap Rendered Here via Supergraph]
        </div>
    </div>
</body>
</html>
